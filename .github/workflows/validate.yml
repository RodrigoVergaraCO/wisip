name: validate

on:
  push:
    branches: [main]
  pull_request:

jobs:
  checks:
    # Wisip es una app de Windows (hook global de teclado, pegado con Ctrl+V);
    # los validadores no cargan el modelo Whisper, así que corren en segundos.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Replacements dictionary
        run: python scripts/check_replacements.py
      - name: URL / email normalizer
        run: python scripts/check_normalizer.py
      - name: Chunk joining (incremental transcription)
        run: python scripts/check_join_chunks.py
      - name: Anti-hallucination tail guards
        run: python scripts/check_tail_guards.py
      - name: Dictation log
        run: python scripts/check_dictation_log.py
      - name: Vocabulary tab (token meter, mining)
        run: python scripts/check_vocab.py
      - name: First-run downloads (local HTTP server, no network)
        run: python scripts/check_setup_assets.py
      - name: Microphone enumeration and onboarding defaults
        run: python scripts/check_audio_devices.py
      - name: Licensing (mock Lemon Squeezy server)
        run: python scripts/check_license.py
      - name: Auto-update (mock releases server)
        run: python scripts/check_updater.py
      - name: Translator + multi-hotkey
        run: python scripts/check_translator.py
